<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7a4e8c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Knitting Helper</title>
  <style>
    :root {
      /* --accent-l / --accent-d are set from JS to the project's color. */
      --accent: var(--accent-l, #7a4e8c);
      --base-bg: #faf7f5;
      --card: #ffffff;
      --text: #2d2430;
      --muted: #7b7080;
      --accent-soft: color-mix(in srgb, var(--accent) 14%, var(--card));
      --bg: color-mix(in srgb, var(--accent) 5%, var(--base-bg));
      --border: #e6dfe8;
      --danger: #b3394a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --accent: var(--accent-d, #c79be0);
        --base-bg: #1b171d;
        --card: #262029;
        --text: #f1ecf3;
        --muted: #a99fae;
        --accent-soft: color-mix(in srgb, var(--accent) 20%, var(--card));
        --bg: color-mix(in srgb, var(--accent) 6%, var(--base-bg));
        --border: #3a323e;
        --danger: #f08a98;
      }
    }
    /* Older browsers without color-mix: plain neutral tints. */
    @supports not (color: color-mix(in srgb, red 50%, blue)) {
      :root { --accent-soft: #efe6f3; --bg: var(--base-bg); }
      @media (prefers-color-scheme: dark) {
        :root { --accent-soft: #3a2f40; }
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
      -webkit-tap-highlight-color: transparent;
    }
    main { max-width: 480px; margin: 0 auto; }
    header { padding: 16px 0 8px; }
    h1 { font-size: 1.25rem; margin: 0 0 12px; }

    .project-bar { display: flex; gap: 8px; }
    select, input[type="text"] {
      flex: 1;
      min-width: 0;
      font: inherit;
      font-size: 1rem;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
    }
    .icon-btn, .text-btn {
      font: inherit;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 12px;
      min-width: 48px;
      min-height: 48px;
      cursor: pointer;
    }
    .icon-btn { font-size: 1.25rem; }
    .text-btn { padding: 0 14px; font-size: 0.9rem; }
    .text-btn.danger { color: var(--danger); }
    .project-actions { display: flex; gap: 8px; margin-top: 8px; }
    .project-actions .text-btn { flex: 1; }

    .color-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-top: 8px;
    }
    .color-panel p { margin: 0 0 10px; font-size: 0.85rem; color: var(--muted); }
    .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
    .swatch {
      aspect-ratio: 1;
      width: 100%;
      max-width: 48px;
      justify-self: center;
      border-radius: 50%;
      border: none;
      background: var(--sw-l);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--text); }
    @media (prefers-color-scheme: dark) {
      .swatch { background: var(--sw-d); color: #1b171d; }
    }

    .counter {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      margin-top: 16px;
      text-align: center;
    }
    .counter-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .counter h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 0;
    }
    .reset {
      font: inherit;
      font-size: 0.8rem;
      background: none;
      border: none;
      color: var(--muted);
      padding: 8px;
      cursor: pointer;
    }
    .value {
      font-size: 4.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin: 8px 0 16px;
    }
    .controls { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; }
    .controls button {
      font: inherit;
      font-size: 2rem;
      font-weight: 600;
      min-height: 72px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
    }
    .minus { background: var(--accent-soft); color: var(--accent); }
    .plus { background: var(--accent); color: var(--card); }
    .controls button:active { transform: scale(0.97); }

    .list-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      margin-top: 16px;
    }
    .list-card .counter-head { margin-bottom: 4px; }
    .list-card h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 0;
    }
    .add-btn {
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      background: var(--accent-soft);
      color: var(--accent);
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
    }
    .items { list-style: none; margin: 0; padding: 0; }
    .items li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      border-top: 1px solid var(--border);
    }
    .items li:first-child { border-top: none; }
    .item-text { flex: 1; min-width: 0; }
    .item-title { font-weight: 600; overflow-wrap: anywhere; }
    .item-detail { color: var(--muted); font-size: 0.9rem; margin-top: 2px; overflow-wrap: anywhere; }
    .remove {
      font: inherit;
      font-size: 1.25rem;
      background: none;
      border: none;
      color: var(--muted);
      min-width: 44px;
      min-height: 44px;
      cursor: pointer;
    }
    .none { color: var(--muted); font-size: 0.95rem; margin: 8px 0 0; }
    .add-form {
      display: grid;
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .add-form label { display: grid; gap: 4px; font-size: 0.85rem; color: var(--muted); }
    .add-form select, .add-form input { width: 100%; }
    .form-buttons { display: flex; gap: 8px; }
    .form-buttons button { flex: 1; min-height: 48px; border-radius: 12px; font: inherit; font-weight: 600; cursor: pointer; }
    .save { background: var(--accent); color: var(--card); border: none; }
    .cancel { background: var(--card); color: var(--text); border: 1px solid var(--border); }

    .pattern-form { display: flex; gap: 8px; margin-top: 8px; }
    .pattern-form input { flex: 1; min-width: 0; }
    .pattern-form .save { border-radius: 12px; padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer; }
    #pattern-link {
      display: block;
      margin: 8px 0 12px;
      color: var(--accent);
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .danger-text { color: var(--danger) !important; }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 8px;
    }
    .photo-grid:empty { display: none; }
    .photo-grid button {
      padding: 0;
      border: none;
      background: var(--accent-soft);
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 1;
      cursor: pointer;
    }
    .photo-grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #photos-status { color: var(--muted); font-size: 0.9rem; margin: 8px 0 0; }

    .viewer {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(0, 0, 0, 0.92);
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    .viewer img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
    .viewer-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      color: #ddd;
    }
    .viewer-bar span { flex: 1; font-size: 0.9rem; }
    .viewer-bar button {
      font: inherit;
      font-weight: 600;
      min-height: 44px;
      padding: 0 16px;
      border-radius: 12px;
      border: 1px solid #555;
      background: #222;
      color: #fff;
      cursor: pointer;
    }
    .viewer-bar .delete { color: #f08a98; }

    .empty { text-align: center; color: var(--muted); padding: 48px 0; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>🧶 Knitting Helper</h1>
      <div class="project-bar">
        <select id="project-select" aria-label="Current project"></select>
        <button class="icon-btn" id="add-project" aria-label="New project">＋</button>
      </div>
      <div class="project-actions" id="project-actions">
        <button class="text-btn" id="rename-project">Rename</button>
        <button class="text-btn" id="color-project" aria-expanded="false">Color</button>
        <button class="text-btn danger" id="delete-project">Delete</button>
      </div>
      <div class="color-panel hidden" id="color-panel">
        <p id="color-name"></p>
        <div class="swatches" id="swatches"></div>
      </div>
    </header>

    <div id="counters">
      <section class="counter" data-key="rows">
        <div class="counter-head">
          <h2>Rows</h2>
          <button class="reset" data-action="reset">Reset</button>
        </div>
        <div class="value" aria-live="polite">0</div>
        <div class="controls">
          <button class="minus" data-action="dec" aria-label="Decrease rows">−</button>
          <button class="plus" data-action="inc" aria-label="Increase rows">+</button>
        </div>
      </section>

      <section class="counter" data-key="stitches">
        <div class="counter-head">
          <h2>Stitches</h2>
          <button class="reset" data-action="reset">Reset</button>
        </div>
        <div class="value" aria-live="polite">0</div>
        <div class="controls">
          <button class="minus" data-action="dec" aria-label="Decrease stitches">−</button>
          <button class="plus" data-action="inc" aria-label="Increase stitches">+</button>
        </div>
      </section>
    </div>

    <div id="lists">
      <section class="list-card" data-list="needles">
        <div class="counter-head">
          <h2>Needles</h2>
          <button class="add-btn" data-action="open-form">＋ Add</button>
        </div>
        <ul class="items"></ul>
        <p class="none">No needles added yet.</p>
        <form class="add-form hidden"></form>
      </section>

      <section class="list-card" data-list="yarns">
        <div class="counter-head">
          <h2>Yarn</h2>
          <button class="add-btn" data-action="open-form">＋ Add</button>
        </div>
        <ul class="items"></ul>
        <p class="none">No yarn added yet.</p>
        <form class="add-form hidden"></form>
      </section>
    </div>

    <div id="extras">
      <section class="list-card" id="pattern-card">
        <div class="counter-head"><h2>Pattern</h2></div>
        <div id="pattern-view" class="hidden">
          <a id="pattern-link" target="_blank" rel="noopener noreferrer"></a>
          <div class="form-buttons">
            <button class="cancel" id="pattern-edit" type="button">Edit</button>
            <button class="cancel danger-text" id="pattern-remove" type="button">Remove</button>
          </div>
        </div>
        <form id="pattern-form" class="pattern-form">
          <input type="text" inputmode="url" autocapitalize="off" spellcheck="false" id="pattern-input" placeholder="Paste a link to the pattern" autocomplete="off" aria-label="Pattern link">
          <button class="save" type="submit">Save</button>
        </form>
      </section>

      <section class="list-card" id="photos-card">
        <div class="counter-head">
          <h2>Photos</h2>
          <label class="add-btn">＋ Add<input type="file" id="photo-input" accept="image/*" multiple hidden></label>
        </div>
        <div class="photo-grid" id="photo-grid"></div>
        <p class="none" id="photos-none">No photos yet. Add some as you go to see your progress.</p>
        <p class="hidden" id="photos-status"></p>
      </section>
    </div>

    <p class="empty hidden" id="empty">No projects yet. Tap ＋ to start one.</p>
  </main>

  <div id="viewer" class="viewer hidden" role="dialog" aria-label="Photo">
    <img id="viewer-img" alt="">
    <div class="viewer-bar">
      <span id="viewer-date"></span>
      <button class="delete" id="viewer-delete" type="button">Delete</button>
      <button id="viewer-close" type="button">Close</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "knitting-helper:v1";

    // Common choices shown in the dropdowns. Anything the user adds is
    // remembered in state.custom and offered for every project.
    const DEFAULTS = {
      needleSizes: [
        "US 0 (2.0 mm)", "US 1 (2.25 mm)", "US 1.5 (2.5 mm)", "US 2 (2.75 mm)",
        "US 2.5 (3.0 mm)", "US 3 (3.25 mm)", "US 4 (3.5 mm)", "US 5 (3.75 mm)",
        "US 6 (4.0 mm)", "US 7 (4.5 mm)", "US 8 (5.0 mm)", "US 9 (5.5 mm)",
        "US 10 (6.0 mm)", "US 10.5 (6.5 mm)", "US 11 (8.0 mm)", "US 13 (9.0 mm)",
        "US 15 (10.0 mm)", "US 17 (12.75 mm)", "US 19 (15.0 mm)", "US 35 (19.0 mm)",
        "US 50 (25.0 mm)"
      ],
      needleTypes: ["Circular", "Straight", "Double-pointed (DPN)", "Interchangeable", "Cable needle"],
      yarnWeights: [
        "Lace (0)", "Fingering (1)", "Sport (2)", "DK (3)", "Worsted (4)",
        "Aran (4)", "Bulky (5)", "Super Bulky (6)", "Jumbo (7)"
      ],
      fibers: [
        "Wool", "Merino", "Superwash wool", "Alpaca", "Mohair", "Cashmere",
        "Cotton", "Linen", "Silk", "Bamboo", "Acrylic", "Wool/nylon blend", "Wool blend"
      ]
    };

    // Each color has a darker shade for light mode (white text on it stays
    // readable) and a lighter shade for dark mode.
    const COLORS = [
      { key: "purple", name: "Purple", light: "#7a4e8c", dark: "#c79be0" },
      { key: "pink",   name: "Pink",   light: "#c2185b", dark: "#f48fb1" },
      { key: "berry",  name: "Berry",  light: "#b3263a", dark: "#f28b96" },
      { key: "coral",  name: "Coral",  light: "#bf4a22", dark: "#f4a07a" },
      { key: "gold",   name: "Mustard", light: "#946600", dark: "#e8c060" },
      { key: "olive",  name: "Olive",  light: "#5f6e1f", dark: "#c2d37a" },
      { key: "green",  name: "Forest", light: "#2e7d4f", dark: "#86d4a4" },
      { key: "teal",   name: "Teal",   light: "#00756a", dark: "#7fd6c9" },
      { key: "blue",   name: "Blue",   light: "#2a64b5", dark: "#8fb8f0" },
      { key: "indigo", name: "Indigo", light: "#3f4fa8", dark: "#a3adf0" },
      { key: "brown",  name: "Walnut", light: "#7a5236", dark: "#d4a888" },
      { key: "slate",  name: "Slate",  light: "#56606e", dark: "#b4bdc9" }
    ];

    const LISTS = {
      needles: {
        fields: [
          { key: "size", label: "Size", choices: "needleSizes", required: true },
          { key: "type", label: "Type (optional)", choices: "needleTypes" },
          { key: "note", label: "Note (optional)", placeholder: "e.g. for the ribbing" }
        ],
        title: n => [n.size, n.type].filter(Boolean).join(" · "),
        detail: n => n.note
      },
      yarns: {
        fields: [
          { key: "weight", label: "Weight", choices: "yarnWeights", required: true },
          { key: "fiber", label: "Fiber (optional)", choices: "fibers" },
          { key: "name", label: "Brand / colour (optional)", placeholder: "e.g. Malabrigo Rios, Azul" }
        ],
        title: y => [y.weight, y.fiber].filter(Boolean).join(" · "),
        detail: y => y.name
      }
    };

    function load() {
      let data = null;
      try { data = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) {}
      if (!data || !Array.isArray(data.projects)) {
        const first = newProject("My first project");
        data = { projects: [first], currentId: first.id };
      }
      // Fill in fields added after the first version, so old saves keep working.
      data.custom = data.custom || {};
      for (const k of Object.keys(DEFAULTS)) data.custom[k] = data.custom[k] || [];
      for (const p of data.projects) {
        p.needles = p.needles || [];
        p.yarns = p.yarns || [];
        p.pattern = p.pattern || "";
        p.photos = p.photos || [];
      }
      return data;
    }

    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    function newId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    function newProject(name) {
      return { id: newId(), name, rows: 0, stitches: 0, needles: [], yarns: [], pattern: "", photos: [] };
    }

    const state = load();
    const select = document.getElementById("project-select");

    function current() {
      return state.projects.find(p => p.id === state.currentId) || state.projects[0];
    }

    function render() {
      const has = state.projects.length > 0;
      document.getElementById("counters").classList.toggle("hidden", !has);
      document.getElementById("lists").classList.toggle("hidden", !has);
      document.getElementById("extras").classList.toggle("hidden", !has);
      if (!has) document.getElementById("color-panel").classList.add("hidden");
      document.getElementById("project-actions").classList.toggle("hidden", !has);
      select.classList.toggle("hidden", !has);
      document.getElementById("empty").classList.toggle("hidden", has);

      select.innerHTML = "";
      for (const p of state.projects) {
        const opt = document.createElement("option");
        opt.value = p.id;
        opt.textContent = p.name;
        select.appendChild(opt);
      }
      if (!has) return;
      const p = current();
      state.currentId = p.id;
      select.value = p.id;
      for (const section of document.querySelectorAll(".counter")) {
        section.querySelector(".value").textContent = p[section.dataset.key];
      }
      for (const key of Object.keys(LISTS)) renderList(key);
      applyColor();
      // The pattern and photos only need redrawing when the project changes,
      // not on every counter tap.
      if (p.id !== shownProjectId) {
        shownProjectId = p.id;
        renderPattern();
        renderPhotos();
      }
    }
    let shownProjectId = null;

    // ----- Project color -----

    const darkQuery = matchMedia("(prefers-color-scheme: dark)");

    function applyColor() {
      const p = state.projects.length ? current() : null;
      const color = COLORS.find(c => c.key === (p && p.color)) || COLORS[0];
      const root = document.documentElement.style;
      root.setProperty("--accent-l", color.light);
      root.setProperty("--accent-d", color.dark);
      document.querySelector('meta[name="theme-color"]')
        .setAttribute("content", darkQuery.matches ? "#1b171d" : color.light);
      document.getElementById("color-name").textContent = `Project color: ${color.name}`;
      for (const sw of document.querySelectorAll(".swatch")) {
        const on = sw.dataset.key === color.key;
        sw.setAttribute("aria-pressed", on);
        sw.textContent = on ? "✓" : "";
      }
    }
    darkQuery.addEventListener("change", applyColor);

    const swatches = document.getElementById("swatches");
    for (const c of COLORS) {
      const sw = el("button", { type: "button", className: "swatch" });
      sw.dataset.key = c.key;
      sw.style.setProperty("--sw-l", c.light);
      sw.style.setProperty("--sw-d", c.dark);
      sw.setAttribute("aria-label", c.name);
      sw.title = c.name;
      swatches.append(sw);
    }
    swatches.addEventListener("click", e => {
      const sw = e.target.closest(".swatch");
      if (!sw) return;
      current().color = sw.dataset.key;
      save();
      applyColor();
    });

    document.getElementById("color-project").addEventListener("click", e => {
      const panel = document.getElementById("color-panel");
      const open = panel.classList.toggle("hidden") === false;
      e.currentTarget.setAttribute("aria-expanded", open);
    });

    // ----- Pattern link -----

    function normalizeUrl(text) {
      text = text.trim();
      if (!text) return "";
      if (!/^[a-z][a-z0-9+.-]*:/i.test(text)) text = "https://" + text;
      try {
        const url = new URL(text);
        return url.protocol === "http:" || url.protocol === "https:" ? url.href : null;
      } catch (e) {
        return null;
      }
    }

    function renderPattern(editing) {
      const link = current().pattern;
      const showForm = editing || !link;
      document.getElementById("pattern-view").classList.toggle("hidden", showForm);
      document.getElementById("pattern-form").classList.toggle("hidden", !showForm);
      const input = document.getElementById("pattern-input");
      input.value = link;
      if (link) {
        const a = document.getElementById("pattern-link");
        a.href = link;
        a.textContent = link.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
      }
      if (editing) input.focus();
    }

    document.getElementById("pattern-form").addEventListener("submit", e => {
      e.preventDefault();
      const url = normalizeUrl(document.getElementById("pattern-input").value);
      if (url === null) {
        alert("That doesn't look like a web link. Try copying it again from your browser.");
        return;
      }
      current().pattern = url;
      save();
      renderPattern();
    });
    document.getElementById("pattern-edit").addEventListener("click", () => renderPattern(true));
    document.getElementById("pattern-remove").addEventListener("click", () => {
      if (!confirm("Remove the pattern link?")) return;
      current().pattern = "";
      save();
      renderPattern();
    });

    // ----- Photos -----
    // Photos are too big for localStorage, so the images live in IndexedDB
    // (keyed by photo id) and each project just keeps the list of ids.

    let dbPromise = null;
    function photoStore(mode, fn) {
      dbPromise = dbPromise || new Promise((resolve, reject) => {
        const req = indexedDB.open("knitting-helper", 1);
        req.onupgradeneeded = () => req.result.createObjectStore("photos");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      return dbPromise.then(db => new Promise((resolve, reject) => {
        const tx = db.transaction("photos", mode);
        const req = fn(tx.objectStore("photos"));
        tx.oncomplete = () => resolve(req.result);
        tx.onerror = () => reject(tx.error);
      }));
    }
    const putPhoto = (id, blob) => photoStore("readwrite", s => s.put(blob, id));
    const getPhoto = id => photoStore("readonly", s => s.get(id));
    const deletePhoto = id => photoStore("readwrite", s => s.delete(id));

    // Shrink to at most 1600px on the long side so photos don't fill up the phone.
    function shrinkImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.naturalWidth * scale);
          canvas.height = Math.round(img.naturalHeight * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          canvas.toBlob(b => b ? resolve(b) : reject(new Error("encode failed")), "image/jpeg", 0.85);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("unreadable image")); };
        img.src = url;
      });
    }

    const photoUrls = new Map();
    async function photoUrl(id) {
      if (!photoUrls.has(id)) {
        const blob = await getPhoto(id);
        photoUrls.set(id, blob ? URL.createObjectURL(blob) : "");
      }
      return photoUrls.get(id);
    }

    async function renderPhotos() {
      const p = current();
      const grid = document.getElementById("photo-grid");
      document.getElementById("photos-none").classList.toggle("hidden", p.photos.length > 0);
      const buttons = [];
      for (const photo of [...p.photos].reverse()) {
        const btn = el("button", { type: "button" }, [el("img", { alt: "Project photo", loading: "lazy" })]);
        btn.dataset.id = photo.id;
        buttons.push(btn);
      }
      grid.replaceChildren(...buttons);
      for (const btn of buttons) {
        try { btn.firstChild.src = await photoUrl(btn.dataset.id); } catch (e) {}
      }
    }

    function setPhotoStatus(text) {
      const status = document.getElementById("photos-status");
      status.textContent = text;
      status.classList.toggle("hidden", !text);
    }

    document.getElementById("photo-input").addEventListener("change", async e => {
      const files = [...e.target.files];
      e.target.value = "";
      if (!files.length) return;
      const p = current();
      let failed = 0;
      for (let i = 0; i < files.length; i++) {
        setPhotoStatus(files.length > 1 ? `Adding photo ${i + 1} of ${files.length}…` : "Adding photo…");
        try {
          const blob = await shrinkImage(files[i]);
          const id = newId();
          await putPhoto(id, blob);
          p.photos.push({ id, added: new Date().toISOString() });
          save();
        } catch (err) {
          failed++;
        }
      }
      setPhotoStatus(failed ? `${failed} photo${failed > 1 ? "s" : ""} couldn't be added.` : "");
      // Ask the browser not to clear our storage when space runs low.
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      if (current() === p) renderPhotos();
    });

    let viewing = null;
    document.getElementById("photo-grid").addEventListener("click", async e => {
      const btn = e.target.closest("button[data-id]");
      if (!btn) return;
      viewing = current().photos.find(x => x.id === btn.dataset.id);
      if (!viewing) return;
      document.getElementById("viewer-img").src = await photoUrl(viewing.id);
      document.getElementById("viewer-date").textContent = new Date(viewing.added)
        .toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
      document.getElementById("viewer").classList.remove("hidden");
    });

    function closeViewer() {
      document.getElementById("viewer").classList.add("hidden");
      viewing = null;
    }
    document.getElementById("viewer-close").addEventListener("click", closeViewer);
    document.getElementById("viewer-img").addEventListener("click", closeViewer);
    document.getElementById("viewer-delete").addEventListener("click", async () => {
      if (!viewing || !confirm("Delete this photo? This can't be undone.")) return;
      const id = viewing.id;
      current().photos = current().photos.filter(x => x.id !== id);
      save();
      closeViewer();
      await removePhotoData(id);
      renderPhotos();
    });

    async function removePhotoData(id) {
      if (photoUrls.get(id)) URL.revokeObjectURL(photoUrls.get(id));
      photoUrls.delete(id);
      try { await deletePhoto(id); } catch (e) {}
    }

    function el(tag, props, children) {
      const node = Object.assign(document.createElement(tag), props || {});
      for (const c of children || []) node.append(c);
      return node;
    }

    function listCard(key) {
      return document.querySelector(`.list-card[data-list="${key}"]`);
    }

    function renderList(key) {
      const card = listCard(key);
      const cfg = LISTS[key];
      const items = current()[key];
      const ul = card.querySelector(".items");
      ul.innerHTML = "";
      for (const item of items) {
        const text = el("div", { className: "item-text" }, [
          el("div", { className: "item-title", textContent: cfg.title(item) })
        ]);
        const detail = cfg.detail(item);
        if (detail) text.append(el("div", { className: "item-detail", textContent: detail }));
        const remove = el("button", { className: "remove", textContent: "×", type: "button" });
        remove.dataset.action = "remove";
        remove.dataset.id = item.id;
        remove.setAttribute("aria-label", `Remove ${cfg.title(item)}`);
        ul.append(el("li", {}, [text, remove]));
      }
      card.querySelector(".none").classList.toggle("hidden", items.length > 0);
    }

    // Fill a dropdown with the common choices, the user's own choices,
    // and an "Add your own…" option at the end.
    function fillSelect(select, field, selected) {
      select.innerHTML = "";
      if (!field.required) select.append(el("option", { value: "", textContent: "—" }));
      const groups = [["Common", DEFAULTS[field.choices]], ["Your own", state.custom[field.choices]]];
      for (const [label, values] of groups) {
        if (!values.length) continue;
        const group = el("optgroup", { label });
        for (const v of values) group.append(el("option", { value: v, textContent: v }));
        select.append(group);
      }
      select.append(el("option", { value: "__custom", textContent: "＋ Add your own…" }));
      select.value = selected || "";
      if (select.selectedIndex < 0) select.selectedIndex = 0;
      select.dataset.last = select.value;
    }

    function openForm(key) {
      const card = listCard(key);
      const form = card.querySelector(".add-form");
      form.innerHTML = "";
      for (const field of LISTS[key].fields) {
        let input;
        if (field.choices) {
          input = el("select", { name: field.key });
          fillSelect(input, field);
          input.addEventListener("change", () => onSelectChange(input, field));
        } else {
          input = el("input", { type: "text", name: field.key, placeholder: field.placeholder || "" });
        }
        form.append(el("label", {}, [field.label, input]));
      }
      const cancel = el("button", { type: "button", className: "cancel", textContent: "Cancel" });
      cancel.dataset.action = "close-form";
      form.append(el("div", { className: "form-buttons" }, [
        cancel,
        el("button", { type: "submit", className: "save", textContent: "Save" })
      ]));
      form.classList.remove("hidden");
      card.querySelector('[data-action="open-form"]').classList.add("hidden");
    }

    function closeForm(key) {
      const card = listCard(key);
      card.querySelector(".add-form").classList.add("hidden");
      card.querySelector('[data-action="open-form"]').classList.remove("hidden");
    }

    function onSelectChange(select, field) {
      if (select.value !== "__custom") {
        select.dataset.last = select.value;
        return;
      }
      const value = (prompt(`Add your own ${field.label.replace(/ \(optional\)/, "").toLowerCase()}`) || "").trim();
      if (!value) {
        select.value = select.dataset.last;
        return;
      }
      const list = state.custom[field.choices];
      if (!DEFAULTS[field.choices].includes(value) && !list.includes(value)) {
        list.push(value);
        save();
      }
      fillSelect(select, field, value);
    }

    document.getElementById("lists").addEventListener("click", e => {
      const btn = e.target.closest("button[data-action]");
      if (!btn) return;
      const key = btn.closest(".list-card").dataset.list;
      const action = btn.dataset.action;
      if (action === "open-form") openForm(key);
      else if (action === "close-form") closeForm(key);
      else if (action === "remove") {
        const p = current();
        const item = p[key].find(x => x.id === btn.dataset.id);
        if (!item || !confirm(`Remove ${LISTS[key].title(item)}?`)) return;
        p[key] = p[key].filter(x => x !== item);
        save();
        renderList(key);
      }
    });

    document.getElementById("lists").addEventListener("submit", e => {
      e.preventDefault();
      const form = e.target;
      const key = form.closest(".list-card").dataset.list;
      const item = { id: newId() };
      for (const field of LISTS[key].fields) {
        const v = form.elements[field.key].value.trim();
        item[field.key] = v === "__custom" ? "" : v;
      }
      current()[key].push(item);
      save();
      closeForm(key);
      renderList(key);
    });

    select.addEventListener("change", () => {
      state.currentId = select.value;
      save();
      render();
    });

    document.getElementById("add-project").addEventListener("click", () => {
      const name = prompt("Project name", "New project");
      if (name === null) return;
      const p = newProject(name.trim() || "Untitled project");
      state.projects.push(p);
      state.currentId = p.id;
      save();
      render();
    });

    document.getElementById("rename-project").addEventListener("click", () => {
      const p = current();
      const name = prompt("Rename project", p.name);
      if (name === null || !name.trim()) return;
      p.name = name.trim();
      save();
      render();
    });

    document.getElementById("delete-project").addEventListener("click", () => {
      const p = current();
      if (!confirm(`Delete "${p.name}"? This can't be undone.`)) return;
      for (const photo of p.photos) removePhotoData(photo.id);
      state.projects = state.projects.filter(x => x.id !== p.id);
      state.currentId = state.projects[0] ? state.projects[0].id : null;
      save();
      render();
    });

    document.getElementById("counters").addEventListener("click", e => {
      const btn = e.target.closest("button[data-action]");
      if (!btn) return;
      const key = btn.closest(".counter").dataset.key;
      const p = current();
      const action = btn.dataset.action;
      if (action === "inc") p[key]++;
      else if (action === "dec") p[key] = Math.max(0, p[key] - 1);
      else if (action === "reset") {
        if (!confirm(`Reset ${key} to 0?`)) return;
        p[key] = 0;
      }
      if (navigator.vibrate) navigator.vibrate(10);
      save();
      render();
    });

    render();
  </script>
</body>
</html>
